<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIGUE DG MEDAM YO</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#090711;
  color:white;
}

header{
  padding:30px 15px;
  text-align:center;
  background:linear-gradient(135deg,#170a2a,#65145e,#2a0b50);
  border-bottom:2px solid #ffd45a;
}

h1{
  margin:0;
  font-size:32px;
}

header p{
  color:#f4dfff;
}

.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:16px;
}

button{
  padding:15px 8px;
  border:0;
  border-radius:14px;
  background:#29163f;
  color:white;
  font-weight:bold;
  font-size:15px;
}

button.active{
  background:linear-gradient(135deg,#7b2cff,#ff2bb5);
}

.content{
  margin:0 14px 25px;
  padding:16px;
  background:#151022;
  border-radius:18px;
}

h2{
  color:#ffd45a;
}

h3{
  color:#ffd45a;
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 7px;
}

th{
  font-size:12px;
  text-align:left;
  color:#cfc5dc;
}

td{
  padding:11px 7px;
  background:#21192d;
}

td:first-child{
  color:#ffd45a;
  font-weight:bold;
}

.name{
  font-weight:bold;
}

.points{
  color:#70f0ff;
  font-weight:bold;
}

.gifts{
  color:#ff8ddd;
  font-weight:bold;
}

.person{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin:8px 0;
  background:#21192d;
  border-radius:13px;
}

.num{
  color:#ffd45a;
  font-weight:bold;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ffd45a,#ff2bb5);
  color:#160b1c;
  font-weight:bold;
}

.today{
  margin-top:25px;
  padding:15px;
  background:#21192d;
  border-radius:15px;
}

.today-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 8px;
  margin:7px 0;
  background:#151022;
  border-radius:10px;
}

.winner{
  color:#70f0ff;
  font-weight:bold;
}

.note{
  font-size:13px;
  color:#aaa0b5;
}

footer{
  text-align:center;
  color:#999;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h1>👑 LIGUE DG MEDAM YO</h1>
  <p>Championnat TikTok</p>
  <strong>🏆 Pwen chanpyona + 🎁 Kado TikTok</strong>
</header>

<div class="menu">

  <button id="b-classement" onclick="show('classement')">
    🏆 Klasman
  </button>

  <button id="b-participantes" onclick="show('participantes')">
    👑 Patisipan
  </button>

  <button id="b-challenges" onclick="show('challenges')">
    ⚔️ Challenges
  </button>

  <button id="b-resultats" onclick="show('resultats')">
    📊 Rezilta
  </button>

</div>

<div class="content" id="content"></div>

<footer>
  LIGUE DG MEDAM YO © 2026
</footer>

<script>

/* =========================
   LIS PATISIPAN YO
   ========================= */

const medam = [

  ["Paul Mirguerlande",6,"60K + 31K400"],

  ["Camie",6,"46K + 11K200"],

  ["Sendy",6,"88K + 100K"],

  ["Queen la Rebelle",3,"31K"],

  ["Leeyoo",6,"18K400 + 13K200"],

  ["Tayou",3,"16K200"],

  ["Teekah",3,"15K600"],

  ["Mystie",3,"1K60 + 18K100"],

  ["Dachou",3,"00 + 11K100"],

  ["Belineda",0,"7K30"],

  ["Black Queen",0,"34K250"],

  ["Queen Lincey",0,"6K"],

  ["La Rosa",0,"3K150"],

  ["Manunu",3,"9K860 + 12K500"],

  ["Anastasia",0,"00"],

  ["Queen Chrisou",0,"19K200"]

];


/* =========================
   GAYAN JODI A
   06 OKTOB 2026
   ========================= */

const gayanJodi = [

  ["Manunu","12K500"],

  ["Leeyoo","13K200"],

  ["Sendy","100K"]

];


/* =========================
   ACTIVE MENU
   ========================= */

function active(x){

  document
    .querySelectorAll("button")
    .forEach(b => b.classList.remove("active"));

  document
    .getElementById("b-" + x)
    .classList.add("active");
}


/* =========================
   AFFICHE SEKSYON YO
   ========================= */

function show(x){

  active(x);

  let c = document.getElementById("content");


  /* =====================
     KLASMAN
     ===================== */

  if(x == "classement"){

    c.innerHTML = `

      <h2>🏆 Klasman — LIGUE DG MEDAM YO</h2>

      <table>

        <tr>
          <th>#</th>
          <th>Medam</th>
          <th>🏆 Pwen</th>
          <th>🎁 Kado</th>
        </tr>

        ${medam.map((m,i) => `

          <tr>

            <td>${i+1}</td>

            <td class="name">
              ${m[0]}
            </td>

            <td class="points">
              ${m[1]}
            </td>

            <td class="gifts">
              ${m[2]}
            </td>

          </tr>

        `).join("")}

      </table>


      <div class="today">

        <h3>
          🏆 Gayan Jodi a — 06 Oktòb 2026
        </h3>

        ${gayanJodi.map(m => `

          <div class="today-row">

            <span class="winner">
              ${m[0]}
            </span>

            <span>
              🏆 +3 pwen &nbsp; 🎁 ${m[1]}
            </span>

          </div>

        `).join("")}

      </div>


      <p class="note">

        🏆 Pwen yo se pwen chanpyona.
        🎁 Kado yo se kado TikTok.
        Kado yo pa ranplase pwen chanpyona yo.

      </p>

    `;
  }


  /* =====================
     PATISIPAN
     ===================== */

  if(x == "participantes"){

    c.innerHTML = `

      <h2>👑 16 Patisipan</h2>

      ${medam.map((m,i) => `

        <div class="person">

          <span class="num">
            ${i+1}
          </span>

          <span class="avatar">
            ${m[0][0]}
          </span>

          <strong>
            ${m[0]}
          </strong>

        </div>

      `).join("")}

    `;
  }


  /* =====================
     CHALLENGES
     ===================== */

  if(x == "challenges"){

    c.innerHTML = `

      <h2>⚔️ Challenges</h2>

      <p class="note">
        Match ak challenges yo ap parèt isit la.
      </p>

    `;
  }


  /* =====================
     REZILTA
     ===================== */

  if(x == "resultats"){

    c.innerHTML = `

      <h2>📊 Rezilta</h2>

      <table>

        <tr>
          <th>Medam</th>
          <th>🏆 Pwen</th>
          <th>🎁 Kado</th>
        </tr>

        ${medam.map(m => `

          <tr>

            <td class="name">
              ${m[0]}
            </td>

            <td class="points">
              ${m[1]}
            </td>

            <td class="gifts">
              ${m[2]}
            </td>

          </tr>

        `).join("")}

      </table>

    `;
  }

}


/* =========================
   LOUVRI KLASMAN OTOMATIK
   ========================= */

show("classement");

</script>

</body>
</html>
