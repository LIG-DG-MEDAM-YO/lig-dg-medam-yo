<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIGUE DG MEDAM YO</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f2f5ff;
      color: #222;
    }

    header {
      background: #1455d9;
      color: white;
      text-align: center;
      padding: 35px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      font-size: 17px;
    }

    .country {
      font-size: 20px;
      font-weight: bold;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 20px;
    }

    .button {
      background: white;
      border-radius: 15px;
      padding: 20px 10px;
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      cursor: pointer;
    }

    .content {
      background: white;
      margin: 0 20px 25px;
      padding: 20px;
      border-radius: 15px;
    }

    .content h2 {
      color: #1455d9;
    }

    li {
      margin: 10px 0;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>🏆 LIGUE DG MEDAM YO</h1>
    <p>Bienvenue sur l'application de la Ligue DG Medam Yo</p>
    <div class="country">🇭🇹 Haïti</div>
  </header>

  <div class="menu">

    <div class="button" onclick="showSection('classement')">
      🏆 Classement
    </div>

    <div class="button" onclick="showSection('participantes')">
      👑 Participantes
    </div>

    <div class="button" onclick="showSection('challenges')">
      ⚔️ Challenges
    </div>

    <div class="button" onclick="showSection('resultats')">
      📊 Résultats
    </div>

  </div>

  <div class="content" id="content">

    <h2>👑 Participantes</h2>

    <ol>
      <li>Camie</li>
      <li>Manunu</li>
    </ol>

  </div>

  <footer>
    LIGUE DG MEDAM YO © 2026
  </footer>

  <script>
    function showSection(section) {

      let content = document.getElementById("content");

      if (section === "classement") {
  content.innerHTML = `
    <h2>🏆 Classement</h2>
    <ol>
      <li>Camie — 0 points</li>
      <li>Manunu — 0 points</li>
    </ol>
  `;
      }

      if (section === "participantes") {
        content.innerHTML = `
          <h2>👑 Participantes</h2>
          <ol>
            <li>Camie</li>
            <li>Manunu</li>
          </ol>
        `;
      }

      if (section === "challenges") {
        content.innerHTML = `
          <h2>⚔️ Challenges</h2>
          <p>Les challenges de la LIGUE DG MEDAM YO apparaîtront ici.</p>
        `;
      }

      if (section === "resultats") {
        content.innerHTML = `
          <h2>📊 Résultats</h2>
          <p>Les résultats de la compétition apparaîtront ici.</p>
        `;
      }
    }
  </script>

</body>
</html>
